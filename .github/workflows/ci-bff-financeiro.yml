name: CI - bff-financeiro

on:
  push:
    branches: ["**"]
    paths: ["bff-financeiro/**"]
  pull_request:
    branches: ["**"]
    paths: ["bff-financeiro/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: bff-financeiro
        run: mvn clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
