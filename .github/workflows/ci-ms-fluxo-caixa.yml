name: CI - ms-fluxo-caixa

on:
  push:
    branches: [ "main", "feature/**" ]
    paths: ["ms-fluxo-caixa/**"]
  pull_request:
    branches: [ "main" ]
    paths: ["ms-fluxo-caixa/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        working-directory: ms-fluxo-caixa
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn clean verify
